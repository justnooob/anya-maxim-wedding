services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: weddinguser
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wedding_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddinguser -d wedding"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wedding_pg:
