name: Check pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test notification and party planning changes
        run: node --test tests/party-groups.test.mjs tests/party-interest.test.mjs tests/admin-analytics.test.mjs tests/telegram-edit-rsvp.test.mjs tests/wishlist.test.mjs
      - name: Run all existing tests
        run: npm test
      - name: Validate TypeScript
        if: always()
        run: npm run typecheck
      - name: Build production site
        if: always()
        run: npm run build
