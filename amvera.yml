# Shared by website and bot. Runtime APP_ROLE=web (default) or bot.
meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  skip: false
  additionalCommands: npm run build
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: npm run start:amvera
  persistenceMount: /data
  containerPort: "3000"
  singleton: false
  zeroDowntime: true
